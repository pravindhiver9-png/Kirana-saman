name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Generate Android Launcher Icons from SVG
        run: |
          npm install --no-save sharp
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          const svg = fs.readFileSync("www/icon.svg", "utf8");
          const resBase = "android/app/src/main/res";
          const anydpiDir = path.join(resBase, "mipmap-anydpi-v26");
          if (fs.existsSync(anydpiDir)) {
            fs.rmSync(anydpiDir, { recursive: true, force: true });
          }

          const sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192
          };

          (async () => {
            for (const [folder, px] of Object.entries(sizes)) {
              const dir = path.join(resBase, folder);
              fs.mkdirSync(dir, { recursive: true });
              const buf = await sharp(Buffer.from(svg)).resize(px, px).png().toBuffer();
              fs.writeFileSync(path.join(dir, "ic_launcher.png"), buf);
              fs.writeFileSync(path.join(dir, "ic_launcher_round.png"), buf);
              fs.writeFileSync(path.join(dir, "ic_launcher_foreground.png"), buf);
            }
          })();
          '
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saman-list-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
