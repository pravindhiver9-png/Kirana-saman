  </defs>

  <rect width="240" height="240" fill="url(#bgSky)"/>

  <circle cx="120" cy="124" r="96" fill="#B8D4E8" opacity="0.45"/>
  <circle cx="120" cy="120" r="94" fill="url(#discGrad)" stroke="#D4E6F3" stroke-width="3"/>

  <!-- Shop Body -->
  <rect x="68" y="104" width="104" height="58" rx="4" fill="url(#shopDark)"/>
  <rect x="68" y="104" width="104" height="9" fill="#1E394B" opacity="0.28"/>

  <!-- Door -->
  <path d="M105 162 L105 135 Q105 128 112 128 L128 128 Q135 128 135 135 L135 162 Z" fill="#F6FAFD"/>

  <!-- Awning Top Slope -->
  <path d="M56 96 L73 60 Q75 56 80 56 L160 56 Q165 56 167 60 L184 96 Z" fill="url(#shopDark)"/>
  <polygon points="92,56 109,56 105,96 82,96" fill="url(#shopLight)"/>
  <polygon points="131,56 148,56 158,96 135,96" fill="url(#shopLight)"/>

  <!-- Scalloped Awning Bottom Edge -->
  <path d="M56 96 H81.6 V100 A12.8 12.8 0 0 1 56 100 Z" fill="url(#shopLight)"/>
  <path d="M81.6 96 H107.2 V100 A12.8 12.8 0 0 1 81.6 100 Z" fill="url(#shopDark)"/>
  <path d="M107.2 96 H132.8 V100 A12.8 12.8 0 0 1 107.2 100 Z" fill="url(#shopLight)"/>
  <path d="M132.8 96 H158.4 V100 A12.8 12.8 0 0 1 132.8 100 Z" fill="url(#shopDark)"/>
  <path d="M158.4 96 H184 V100 A12.8 12.8 0 0 1 158.4 100 Z" fill="url(#shopLight)"/>

  <!-- Base Sill -->
  <rect x="57" y="159" width="126" height="14" rx="7" fill="url(#shopDark)"/>
