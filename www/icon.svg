<svg viewBox="0 0 240 240" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF5FC"/>
      <stop offset="100%" stop-color="#DCECF7"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F6FAFD"/>
      <stop offset="100%" stop-color="#E3EFF8"/>
    </radialGradient>
    <linearGradient id="shopDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E6B89"/>
      <stop offset="100%" stop-color="#2D526B"/>
    </linearGradient>
    <linearGradient id="shopLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBE3F3"/>
      <stop offset="100%" stop-color="#A8CBE3"/>
