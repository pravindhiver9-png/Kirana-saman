<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saman List</title>

<style>
:root{
  --primary:#607D8B;
  --dark-primary:#455F6D;
  --bg:#EAF1F4;
  --card:#F8FAFB;
  --soft-blue:#DCE7EC;
  --text:#202C35;
  --sec-text:#647783;
  --divider:#C7D6DE;
  --delete:#E76B64;
  --app-bg:url("app_bg.png");
  --neu-shadow:8px 8px 16px rgba(155, 178, 191, 0.45), -8px -8px 16px rgba(255, 255, 255, 0.88);
  --neu-sm:5px 5px 11px rgba(155, 178, 191, 0.42), -5px -5px 11px rgba(255, 255, 255, 0.88);
  --neu-inset:inset 3px 3px 7px rgba(155, 178, 191, 0.45), inset -3px -3px 7px rgba(255, 255, 255, 0.85);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans Devanagari","Segoe UI",sans-serif;
  background-color:var(--bg);
  background-image:var(--app-bg);
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
  color:var(--text);
  padding-bottom:24px;
  min-height:100vh;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:12px 14px 28px;
}

/* Neumorphic Top Shop & Logo Card with Visible App BG */
.top-card{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-radius:24px;
  background:linear-gradient(145deg, rgba(248,250,251,0.78), rgba(220,231,236,0.72));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1.2px solid rgba(255,255,255,0.85);
  box-shadow:var(--neu-shadow), inset 0 1px 1px rgba(255,255,255,0.9);
}
.shop-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.shop-logo{
  width:56px;
  height:56px;
  flex-shrink:0;
  border-radius:50%;
  box-shadow:var(--neu-sm);
}
.shop-name{
  font-size:20px;
  font-weight:700;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,0.8);
}
.shop-place{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:13px;
  color:var(--sec-text);
  margin-top:3px;
  font-weight:600;
}
.cart-box{
  position:relative;
  display:flex;
  align-items:center;
  padding-left:12px;
  border-left:1.2px solid rgba(199,214,222,0.8);
  flex-shrink:0;
}
.cart-badge{
  position:absolute;
  top:-6px;
  right:-6px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:99px;
  background:linear-gradient(145deg, var(--primary), var(--dark-primary));
  color:#fff;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:2px 2px 6px rgba(32,44,53,0.22);
}

/* Neumorphic Date & Kul Suchi Heading Bar */
.date-bar{
  position:relative;
  overflow:hidden;
  width:100%;
  height:52px;
  margin:12px 0 10px;
  border-radius:999px;
  background:linear-gradient(145deg, rgba(248,250,251,0.78), rgba(220,231,236,0.72));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1.2px solid rgba(255,255,255,0.88);
  box-shadow:var(--neu-shadow), inset 0 1px 1px rgba(255,255,255,0.9);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px;
}
.date-left{
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:14px;
  color:var(--dark-primary);
  font-size:15.5px;
  font-weight:700;
  white-space:nowrap;
}
.date-left svg{
  width:20px;
  height:20px;
  fill:var(--dark-primary);
  flex-shrink:0;
}
.count-pill{
  height:100%;
  padding:0 16px 0 18px;
  border-radius:999px;
  background:linear-gradient(145deg, var(--primary), var(--dark-primary));
  color:#FFFFFF;
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(255,255,255,0.45);
  box-shadow:3px 3px 8px rgba(32,44,53,0.22), inset 1px 1px 2px rgba(255,255,255,0.35);
  white-space:nowrap;
}
.count-pill svg{
  width:19px;
  height:19px;
  fill:#FFFFFF;
  flex-shrink:0;
}

/* Neumorphic Table Heading Box with Visible BG */
.th-bar{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:44px 1fr 82px 68px;
  align-items:center;
  background:linear-gradient(145deg, rgba(96,125,139,0.86), rgba(69,95,109,0.90));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#fff;
  border-radius:18px;
  padding:11px 14px;
  font-size:14.5px;
  font-weight:700;
  border:1.2px solid rgba(255,255,255,0.62);
  box-shadow:5px 5px 12px rgba(69,95,109,0.28), -4px -4px 10px rgba(255,255,255,0.65), inset 1px 1px 2px rgba(255,255,255,0.35);
  margin-bottom:10px;
}
.th-c{text-align:center}

/* Search & Add */
#s{
  display:block;
  width:100%;
  margin:10px 0;
  padding:11px 14px;
  font-size:16px;
  background:rgba(248,250,251,0.84);
  backdrop-filter:blur(5px);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:16px;
  box-shadow:var(--neu-inset);
  outline:none;
}
#s:focus{
  border-color:var(--primary);
  box-shadow:var(--neu-inset), 0 0 0 2px rgba(96,125,139,0.2);
}
.add-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  margin:8px 0 12px;
  padding:11px 14px;
  border:1px solid rgba(255,255,255,0.85);
  border-radius:16px;
  background:linear-gradient(145deg, rgba(248,250,251,0.82), rgba(220,231,236,0.76));
  backdrop-filter:blur(5px);
  color:var(--dark-primary);
  font-size:16px;
  font-weight:700;
  box-shadow:var(--neu-sm);
  cursor:pointer;
}

/* Neumorphic Item Rows */
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px 12px;
  margin-bottom:8px;
  border-radius:16px;
  background:linear-gradient(145deg, rgba(248,250,251,0.82), rgba(234,241,244,0.76));
  backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,0.82);
  box-shadow:var(--neu-sm);
}
.row.on{
  background:linear-gradient(145deg, rgba(220,231,236,0.9), rgba(199,214,222,0.82));
  border-color:rgba(255,255,255,0.92);
  box-shadow:var(--neu-inset);
}
.row label{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:600;
  min-width:0;
}
.row input[type=checkbox]{
  width:22px;
  height:22px;
  accent-color:var(--dark-primary);
  flex-shrink:0;
}
.row .qty-input{
  display:none;
  width:72px;
  font-size:16px;
  font-weight:700;
  padding:6px 8px;
  text-align:center;
  border:1.5px solid var(--dark-primary);
  border-radius:12px;
  background:rgba(255,255,255,0.95);
  color:var(--text);
  box-shadow:var(--neu-inset);
  outline:none;
}
.row.on .qty-input{
  display:inline-block;
}
.unit{
  min-width:60px;
  text-align:center;
  color:var(--dark-primary);
  font-weight:700;
  font-size:14.5px;
  background:rgba(234,241,244,0.85);
  border:1px solid rgba(255,255,255,0.8);
  box-shadow:2px 2px 5px rgba(155,178,191,0.35), -2px -2px 5px rgba(255,255,255,0.85);
  padding:4px 8px;
  border-radius:12px;
}

/* Primary & History Cards */
.btn{
  display:block;
  width:100%;
  margin:14px 0;
  padding:14px;
  border:1px solid rgba(255,255,255,0.55);
  border-radius:18px;
  background:linear-gradient(145deg, #74909E, var(--dark-primary));
  color:#fff;
  font-size:17px;
  font-weight:700;
  box-shadow:6px 6px 14px rgba(69,95,109,0.28), -5px -5px 12px rgba(255,255,255,0.75);
  cursor:pointer;
}
.card{
  margin:9px 0;
  padding:12px 14px;
  background:linear-gradient(145deg, rgba(248,250,251,0.82), rgba(220,231,236,0.75));
  backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,0.85);
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:var(--neu-sm);
}
.card .info{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.card .info small{color:var(--sec-text);font-size:13.5px}
.del{
  border:1px solid rgba(231,107,100,0.75);
  color:var(--delete);
  background:rgba(248,250,251,0.9);
  border-radius:12px;
  padding:7px 11px;
  font-size:14px;
  font-weight:700;
  box-shadow:3px 3px 7px rgba(155,178,191,0.35), -3px -3px 7px rgba(255,255,255,0.85);
}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(145deg, rgba(248,250,251,0.82), rgba(220,231,236,0.75));
  backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,0.85);
  border-radius:18px;
  padding:11px 14px;
  margin-bottom:10px;
  font-weight:700;
  color:var(--dark-primary);
  box-shadow:var(--neu-sm);
}
.back-btn{
  background:none;
  border:0;
  color:var(--dark-primary);
  font-size:16px;
  font-weight:700;
  padding:0;
}
.bar{
  position:sticky;
  bottom:0;
  background:rgba(234,241,244,0.72);
  backdrop-filter:blur(8px);
  padding:6px 0 2px;
  border-radius:18px;
}
img.preview-img{
  width:100%;
  border-radius:18px;
  display:block;
  box-shadow:var(--neu-shadow);
}
.empty-search{
  text-align:center;
  color:var(--sec-text);
  padding:22px 10px;
  font-weight:600;
  background:rgba(248,250,251,0.82);
  border-radius:16px;
  box-shadow:var(--neu-sm);
}
</style>
</head>

function getCustomItems(){
  try{
    const data=JSON.parse(localStorage.getItem("customItems")||"[]");
    return Array.isArray(data)?data.filter(x=>Array.isArray(x)&&x.length>=2):[];
  }catch(e){
    return [];
  }

function safeText(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function getAutoDate(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yyyy=d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

}

// Custom phonetic search normalization
// F=फ, Ph=फ, Sh=श/ष, A=अ/आ, Ay=ए, U=उ/ऊ
function normalizeCustomSearch(raw){
  let s=String(raw||"").toLowerCase().trim();

  s=s
    .replace(/ph/g,"f")
    .replace(/sh/g,"s")
    .replace(/ay/g,"e")
    .replace(/aa/g,"a")
    .replace(/ee/g,"i")
    .replace(/ii/g,"i")
    .replace(/oo/g,"u")
    .replace(/uu/g,"u");

  const hindiMap={
    "फ":"f",
    "श":"s","ष":"s","स":"s",
    "अ":"a","आ":"a","ा":"a",
    "ए":"e","े":"e","ै":"e",
    "उ":"u","ऊ":"u","ु":"u","ू":"u",
    "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
    "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny",
    "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
    "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
    "प":"p","ब":"b","भ":"bh","म":"m",
    "य":"y","र":"r","ल":"l","व":"v",
    "ह":"h","इ":"i","ई":"i","ि":"i","ी":"i",
    "ऋ":"ri","ृ":"ri","ओ":"o","ो":"o","औ":"au","ौ":"au",
    "ं":"n","ँ":"n","ः":"h","़":"","्":""
  };

  let out="";
  for(const ch of Array.from(s)){
    out+=Object.prototype.hasOwnProperty.call(hindiMap,ch)?hindiMap[ch]:ch;
  }

  return out.replace(/[^a-z0-9]/g,"");
}

function searchItems(value){
  const raw=value.trim();
  if(!raw)return ALL_ITEMS.map((_,i)=>i);

  const qNorm=normalizeCustomSearch(raw);
  const qLower=raw.toLowerCase();
  const results=[];

  ALL_ITEMS.forEach((item,i)=>{
    const itemNameLower=item[0].toLowerCase();
    const itemUnitLower=item[1].toLowerCase();
    const itemNorm=normalizeCustomSearch(item[0]);
    const unitNorm=normalizeCustomSearch(item[1]);

    const matched=
      itemNameLower.includes(qLower) ||
      itemUnitLower.includes(qLower) ||
      (qNorm && (itemNorm.includes(qNorm) || unitNorm.includes(qNorm)));

    if(matched)results.push(i);
  });

  return results;
}

async function del(id){
  if(!confirm("Is list ko delete karein?"))return;
  try{
    if(FS())await FS().deleteFile({path:`lists/${id}.jpg`,directory:"DATA"});
  }catch(e){}
  localStorage.setItem("hist",JSON.stringify(hist().filter(x=>String(x.id)!==String(id))));
  home();
}

async function view(id){

function addItem(){
  const name=prompt("नए सामान का नाम लिखें:");
  if(!name||!name.trim())return;
  const cleanName=name.trim();
  const exists=ALL_ITEMS.some(x=>x[0].toLowerCase()===cleanName.toLowerCase());
  if(exists){alert("यह सामान पहले से सूची में है");return;}
  const unit=prompt("Unit लिखें (जैसे: KG, नग, पैकेट, पत्ता, पूड़ा, पेटी, टिन):","नग");
  if(!unit||!unit.trim())return;
  const item=[cleanName,unit.trim()];
  const custom=getCustomItems();
  custom.push(item);
  localStorage.setItem("customItems",JSON.stringify(custom));
  ALL_ITEMS.push(item);
  const currentSearch=$("#s")?$("#s").value:"";
  renderRows(searchItems(currentSearch));
}

function renderRows(indices){
  const container=$("#itemList");
  if(!indices.length){
    container.innerHTML=`<div class="empty-search">कोई सामान नहीं मिला</div>`;
    updateTickCount();
    return;
  }
  container.innerHTML=indices.map((i,idx)=>`
    <div class="row ${selectedItems[i]?"on":""}" id="r${i}">
      <label>
        <input type="checkbox" class="item-chk" data-i="${i}" ${selectedItems[i]?"checked":""}>
        <span>${String(idx+1).padStart(2,"0")}. ${safeText(ALL_ITEMS[i][0])}</span>
      </label>
      <input
        type="text"
        class="qty-input"
        inputmode="decimal"
        id="q${i}"
        placeholder="Qty"
        value="${selectedItems[i]?safeText(selectedItems[i].qty):""}"
      >
      <span class="unit">${safeText(ALL_ITEMS[i][1])}</span>
    </div>
  `).join("");

  indices.forEach(i=>{
    const rowEl=$("#r"+i);
    const checkbox=$(`#r${i} .item-chk`);
    const quantity=$("#q"+i);

    checkbox.onchange=()=>{
      if(checkbox.checked){
        selectedItems[i]={qty:quantity.value};
        rowEl.classList.add("on");
        setTimeout(()=>quantity.focus(),40);
      }else{
        delete selectedItems[i];
        rowEl.classList.remove("on");
        quantity.value="";
      }
      updateTickCount();
    };

    quantity.oninput=()=>{
      let clean=quantity.value.replace(/[^0-9.]/g,"");
      const parts=clean.split(".");
      if(parts.length>2){
        clean=parts[0]+"."+parts.slice(1).join("");
      }
      quantity.value=clean;
      if(!selectedItems[i]){
        selectedItems[i]={qty:clean};
        checkbox.checked=true;
        rowEl.classList.add("on");
        updateTickCount();
      }else{
        selectedItems[i].qty=clean;
      }
    };
  });

  updateTickCount();
}

function entry(){

  app.innerHTML=`

function loadBgImage(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

function drawRoundedRectPath(g, x, y, w, h, r){
  const radius = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + radius, y);
  g.arcTo(x + w, y, x + w, y + h, radius);
  g.arcTo(x + w, y + h, x, y + h, radius);
  g.arcTo(x, y + h, x, y, radius);
  g.arcTo(x, y, x + w, y, radius);
  g.closePath();
}

function drawNeuCard(g, x, y, w, h, r, fillStyle, strokeStyle = "rgba(255,255,255,0.88)"){
  g.save();
  g.shadowColor = "rgba(255, 255, 255, 0.9)";
  g.shadowBlur = 12;
  g.shadowOffsetX = -5;
  g.shadowOffsetY = -5;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  g.save();
  g.shadowColor = "rgba(32, 44, 53, 0.14)";
  g.shadowBlur = 14;
  g.shadowOffsetX = 6;
  g.shadowOffsetY = 6;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  drawRoundedRectPath(g, x, y, w, h, r);
  g.strokeStyle = strokeStyle;
  g.lineWidth = 2;
  g.stroke();
}

// 4K export with neumorphic cards/rows over app_bg.png, extra open row space, no edit/delete or bottom buttons
async function draw4K(rows, dateStr){
  const W = 1080;
  const targetWidth = 3840;
  const S = targetWidth / W;

  const startY = 344;
  const rowH = 74;
  const totalSlots = rows.length + EXTRA_ROWS;
  const H = startY + (totalSlots * rowH) + 32;

  const c = document.createElement("canvas");
  c.width = targetWidth;
  c.height = Math.ceil(H * S);

  const g = c.getContext("2d");
  g.scale(S, S);

  const L = 44;
  const R = W - 44;
  const boxW = R - L;
  const HF = '"Noto Sans Devanagari","Segoe UI",sans-serif';

  // 1. Background (app_bg.png visible across full canvas)
  g.fillStyle = "#EAF1F4";
  g.fillRect(0, 0, W, H);

  const bgImg = await loadBgImage("app_bg.png");
  if(bgImg){
    const imgRatio = bgImg.width / bgImg.height;
    const canvasRatio = W / H;
    let dw = W, dh = H, dx = 0, dy = 0;
    if(imgRatio > canvasRatio){
      dh = H;
      dw = H * imgRatio;
      dx = (W - dw) / 2;
    }else{
      dw = W;
      dh = W / imgRatio;
      dy = (H - dh) / 2;
    }
    g.drawImage(bgImg, dx, dy, dw, dh);
  }

  // 2. Neumorphic Top Shop & Logo Card
  const topGrad = g.createLinearGradient(L, 24, R, 158);
  topGrad.addColorStop(0, "rgba(248, 250, 251, 0.86)");
  topGrad.addColorStop(1, "rgba(220, 231, 236, 0.80)");
  drawNeuCard(g, L, 24, boxW, 134, 34, topGrad, "rgba(255, 255, 255, 0.92)");

  const badgeCx = L + 74;
  const badgeCy = 91;
  g.save();
  g.shadowColor = "rgba(32, 44, 53, 0.14)";
  g.shadowBlur = 10;
  g.shadowOffsetX = 4;
  g.shadowOffsetY = 4;
  g.beginPath();
  g.arc(badgeCx, badgeCy, 42, 0, Math.PI * 2);
  g.fillStyle = "rgba(248, 250, 251, 0.94)";
  g.fill();
  g.restore();

  g.beginPath();
  g.arc(badgeCx, badgeCy, 42, 0, Math.PI * 2);
  g.strokeStyle = "#FFFFFF";
  g.lineWidth = 2.5;
  g.stroke();

  g.fillStyle = "#455F6D";
  g.beginPath();
  g.moveTo(badgeCx - 22, badgeCy - 4);
  g.lineTo(badgeCx - 16, badgeCy - 20);
  g.lineTo(badgeCx + 16, badgeCy - 20);
  g.lineTo(badgeCx + 22, badgeCy - 4);
  g.closePath();
  g.fill();

  g.fillStyle = "#607D8B";
  g.fillRect(badgeCx - 17, badgeCy - 3, 34, 21);
  g.fillStyle = "#F8FAFB";
  g.fillRect(badgeCx - 6, badgeCy + 4, 12, 14);

  g.fillStyle = "#202C35";
  g.textBaseline = "alphabetic";
  g.textAlign = "left";
  g.font = `bold 44px ${HF}`;
  g.fillText(SHOP, L + 132, 84);

  g.fillStyle = "#647783";
  g.font = `600 26px ${HF}`;
  g.fillText(PLACE, L + 132, 124);

  const divX = R - 118;
  g.strokeStyle = "rgba(199, 214, 222, 0.9)";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(divX, 46);
  g.lineTo(divX, 136);
  g.stroke();

  const cartCx = R - 60;
  const cartCy = 94;
  g.fillStyle = "#455F6D";
  g.fillRect(cartCx - 18, cartCy - 6, 30, 14);
  g.beginPath();
  g.arc(cartCx - 10, cartCy + 14, 4.5, 0, Math.PI * 2);
  g.arc(cartCx + 8, cartCy + 14, 4.5, 0, Math.PI * 2);
  g.fill();

  g.beginPath();
  g.arc(cartCx + 14, cartCy - 14, 16, 0, Math.PI * 2);
  g.fillStyle = "#607D8B";
  g.fill();
  g.fillStyle = "#FFFFFF";
  g.font = `bold 18px ${HF}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(String(rows.length), cartCx + 14, cartCy - 13);

  // 3. Neumorphic Date & Kul Suchi Heading Bar
  const metaY = 172;
  const metaH = 56;
  const metaGrad = g.createLinearGradient(L, metaY, R, metaY + metaH);
  metaGrad.addColorStop(0, "rgba(248, 250, 251, 0.88)");
  metaGrad.addColorStop(1, "rgba(220, 231, 236, 0.82)");
  drawNeuCard(g, L, metaY, boxW, metaH, metaH / 2, metaGrad, "rgba(255, 255, 255, 0.92)");

  g.fillStyle = "#455F6D";
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.font = `bold 27px ${HF}`;
  g.fillText(`दिनांक: ${dateStr}`, L + 28, metaY + metaH / 2 + 1);

  const pillW = 248;
  const pillX = R - pillW - 3;
  drawRoundedRectPath(g, pillX, metaY + 3, pillW, metaH - 6, (metaH - 6) / 2);
  const pillGrad = g.createLinearGradient(pillX, metaY + 3, pillX + pillW, metaY + metaH - 3);
  pillGrad.addColorStop(0, "#607D8B");
  pillGrad.addColorStop(1, "#455F6D");
  g.fillStyle = pillGrad;
  g.fill();

  g.fillStyle = "#FFFFFF";
  g.font = `bold 26px ${HF}`;
  g.textAlign = "center";
  g.fillText(`कुल सूची: ${rows.length}`, pillX + pillW / 2 - 10, metaY + metaH / 2 + 1);

  // 4. Neumorphic Table Heading Box
  const thY = 242;
  const thH = 66;
  const thGrad = g.createLinearGradient(L, thY, R, thY + thH);
  thGrad.addColorStop(0, "rgba(96, 125, 139, 0.90)");
  thGrad.addColorStop(1, "rgba(69, 95, 109, 0.94)");
  drawNeuCard(g, L, thY, boxW, thH, thH / 2, thGrad, "rgba(255, 255, 255, 0.72)");

  g.fillStyle = "#FFFFFF";
  g.font = `bold 27px ${HF}`;
  g.textBaseline = "middle";
  g.textAlign = "left";
  g.fillText("No.", L + 26, thY + thH / 2 + 1);
  g.fillText("सामान सूची", L + 135, thY + thH / 2 + 1);

  g.textAlign = "center";
  g.fillText("Quantity", 735, thY + thH / 2 + 1);
  g.fillText("Unit", R - 78, thY + thH / 2 + 1);

  // 5. Neumorphic Ticked Item Rows (No edit/delete buttons, extra rows open on app_bg.png without boxes)
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const y = startY + (i * rowH);
    const pillHeight = rowH - 12;
    const cy = y + (pillHeight / 2);

    const rowGrad = g.createLinearGradient(L, y, R, y + pillHeight);
    rowGrad.addColorStop(0, "rgba(248, 250, 251, 0.88)");
    rowGrad.addColorStop(1, "rgba(220, 231, 236, 0.82)");
    drawNeuCard(g, L, y, boxW, pillHeight, pillHeight / 2, rowGrad, "rgba(255, 255, 255, 0.88)");

    g.fillStyle = "#647783";
    g.font = `bold 27px ${HF}`;
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.fillText(String(i + 1).padStart(2, "0"), L + 28, cy + 1);

    g.fillStyle = "#202C35";
    g.font = `bold 29px ${HF}`;
    g.fillText(r.name, L + 135, cy + 1, 430);

    g.fillStyle = "#202C35";
    g.font = `bold 29px ${HF}`;
    g.textAlign = "center";
    g.fillText(String(r.qty), 735, cy + 1);

    const uW = 108;
    const uH = 40;
    const uX = R - 132;
    drawRoundedRectPath(g, uX, cy - (uH / 2), uW, uH, uH / 2);
    g.fillStyle = "#DCE7EC";
    g.fill();
    g.strokeStyle = "#FFFFFF";
    g.lineWidth = 1.5;
    g.stroke();

    g.fillStyle = "#455F6D";
    g.font = `bold 22px ${HF}`;
    g.fillText(String(r.unit), uX + (uW / 2), cy + 1);
  }

  return c.toDataURL("image/jpeg", 0.98).split(",")[1];
}

async function exportList(){
  const rows=[];
  Object.keys(selectedItems).forEach(key=>{
    const i=Number(key);
    rows.push({
      name:ALL_ITEMS[i][0],
      unit:ALL_ITEMS[i][1],
      qty:selectedItems[i].qty||"-"
    });
  });

  if(!rows.length){
    alert("कम से कम एक सामान tick करें");
    return;
  }

  const d=new Date();
  const dateStr=getAutoDate();
  const b64=await draw4K(rows,dateStr);
  const id=Date.now();

  try{
    if(P() && P().Share && FS()){
      const f=await FS().writeFile({
        path:`share_${id}.jpg`,
        data:b64,
        directory:"CACHE"
      });
      await P().Share.share({
        title:"Saman List",
        files:[f.uri]
      });
      await FS().writeFile({
        path:`lists/${id}.jpg`,
        data:b64,
        directory:"DATA",
        recursive:true
      });
    }else{
      const link=document.createElement("a");
      link.href="data:image/jpeg;base64,"+b64;
      link.download=`saman_list_${id}.jpg`;
      link.click();
    }

    const h=hist();
    h.unshift({
      id,
      date:dateStr+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      count:rows.length
    });
    localStorage.setItem("hist",JSON.stringify(h));
    home();
  }catch(e){
    if(!/cancel/i.test(String(e&&e.message||e))){
      alert("Error: "+e);
    }
  }
}
