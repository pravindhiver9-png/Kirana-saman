}

  color:#888;
  padding:25px 10px

const PLACE="Kilepar";

.split("\n").map(l=>l.split("|"));


// ======================================
// CUSTOM ITEMS STORAGE
// ======================================

function getCustomItems(){
  try{
    const data=JSON.parse(
      localStorage.getItem("customItems")||"[]"
    );

    return Array.isArray(data)
      ?data.filter(x=>Array.isArray(x)&&x.length>=2)
      :[];

  }catch(e){
    return [];
  }
}

let ALL_ITEMS=[...ITEMS,...getCustomItems()];


// ======================================
// SELECTED ITEMS STORAGE
// ======================================

// Search बदलने पर भी Tick और Quantity सुरक्षित
let selectedItems={};


const P=()=>window.Capacitor.Plugins;
const FS=()=>P().Filesystem;
const $=s=>document.querySelector(s);
const app=$("#app");

const hist=()=>JSON.parse(
  localStorage.getItem("hist")||"[]"
);


// ======================================
// SAFE TEXT
// ======================================

function safeText(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}


// ======================================
// HINDI TO ROMAN CONVERSION
// ======================================

const consonants={
  "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
  "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny",
  "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
  "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
  "प":"p","फ":"ph","ब":"b","भ":"bh","म":"m",
  "य":"y","र":"r","ल":"l","व":"v",
  "श":"sh","ष":"sh","स":"s","ह":"h"
};

const vowels={
  "अ":"a","आ":"aa","इ":"i","ई":"ee",
  "उ":"u","ऊ":"oo","ऋ":"ri","ए":"e",
  "ऐ":"ai","ओ":"o","औ":"au"
};

const matras={
  "ा":"aa","ि":"i","ी":"ee","ु":"u",
  "ू":"oo","ृ":"ri","े":"e","ै":"ai",
  "ो":"o","ौ":"au"
};

function romanizeHindi(value){

  const chars=Array.from(value);
  let result="";

  for(let i=0;i<chars.length;i++){

    const ch=chars[i];

    if(vowels[ch]){
      result+=vowels[ch];
      continue;
    }

    if(consonants[ch]){

      result+=consonants[ch];

      if(chars[i+1]==="्"){
        i++;
        continue;
      }

      if(matras[chars[i+1]]){
        result+=matras[chars[i+1]];
        i++;
      }else{
        result+="a";
      }

      continue;
    }

    if(matras[ch]){
      result+=matras[ch];
      continue;
    }

    if(ch==="ं"||ch==="ँ"){
      result+="n";
      continue;
    }

    if(ch==="ः"){
      result+="h";
      continue;
    }

    if(ch==="़"||ch==="्"){
      continue;
    }

    result+=ch;
  }

  return result.toLowerCase();
}


// ======================================
// SEARCH NORMALIZATION
// ======================================

function normalizeRoman(value){

  return value
    .toLowerCase()
    .replace(/aa/g,"a")
    .replace(/ee/g,"i")
    .replace(/ii/g,"i")
    .replace(/oo/g,"u")
    .replace(/uu/g,"u")
    .replace(/[^a-z0-9]/g,"");
}


// ======================================
// LIVE SEARCH
// ======================================

function searchItems(value){

  const q=value.trim().toLowerCase();

  if(!q){
    return ALL_ITEMS.map((item,i)=>i);
  }

  const romanQuery=normalizeRoman(q);
  const results=[];

  ALL_ITEMS.forEach((item,i)=>{

    const hindiName=item[0].toLowerCase();
    const englishName=romanizeHindi(item[0]);
    const normalizedName=normalizeRoman(englishName);

    const directMatch=hindiName.includes(q);

    const romanMatch=
      englishName.includes(q.replace(/\s+/g,"")) ||
      normalizedName.includes(romanQuery);

    const unitMatch=item[1].toLowerCase().includes(q);

    if(directMatch||romanMatch||unitMatch){
      results.push(i);
    }

  });

  return results;
}


// ======================================
// HOME SCREEN
// ======================================

function home(){

  const h=hist();

  app.innerHTML=`
    <header>${SHOP} – Saman List</header>

    <button class="btn" id="new">
      + New Entry
    </button>

    ${
      h.map(x=>`
        <div class="card">

          <div class="info" data-id="${x.id}">
            <b>${safeText(x.date)}</b>
            <small>${x.count} items</small>
          </div>

          <button class="del" data-id="${x.id}">
            🗑 Delete
          </button>

        </div>
      `).join("")
      ||
      '<p style="text-align:center;color:#888">Abhi koi list save nahi hai</p>'
    }
  `;

  $("#new").onclick=entry;

  document.querySelectorAll(".info").forEach(c=>{
    c.onclick=()=>view(c.dataset.id);
  });

  document.querySelectorAll(".del").forEach(b=>{
    b.onclick=()=>del(b.dataset.id);
  });
}


// ======================================
// DELETE LIST
// ======================================

async function del(id){

  if(!confirm("Is list ko delete karein?"))return;

  try{

    await FS().deleteFile({
      path:`lists/${id}.jpg`,
      directory:"DATA"
    });

  }catch(e){}

  localStorage.setItem(
    "hist",
    JSON.stringify(
      hist().filter(x=>String(x.id)!==String(id))
    )
  );

  home();
}


// ======================================
// VIEW SAVED IMAGE
// ======================================

async function view(id){

  try{

    const r=await FS().readFile({
      path:`lists/${id}.jpg`,
      directory:"DATA"
    });

    app.innerHTML=`
      <header id="back">‹ Wapas</header>
      <img src="data:image/jpeg;base64,${r.data}">
    `;

    $("header").onclick=home;

  }catch(e){

    alert("Image open nahi ho payi: "+e);
    home();

  }
}


// ======================================
// ADD NEW ITEM
// ======================================

function addItem(){

  const name=prompt("Naye saman ka naam likhiye:");

  if(!name||!name.trim())return;

  const cleanName=name.trim();

  const exists=ALL_ITEMS.some(
    x=>x[0].toLowerCase()===cleanName.toLowerCase()
  );

  if(exists){
    alert("Ye saman pehle se list mein hai");
    return;
  }

  const unit=prompt(
    "Saman ki Unit likhiye:\nKG, नग, पैकेट, पत्ता, पूड़ा, पेटी, टिन",
    "नग"
  );

  if(!unit||!unit.trim())return;

  const item=[cleanName,unit.trim()];

  const custom=getCustomItems();

  custom.push(item);

  try{

    localStorage.setItem(
      "customItems",
      JSON.stringify(custom)
    );

    ALL_ITEMS.push(item);

    alert("Naya saman list mein jud gaya!");

    // Search reset, existing selections remain
    entry();

  }catch(e){

    alert("Saman save nahi ho paya: "+e);

  }
}


// ======================================
// RENDER ROWS - SELECTION PRESERVED
// ======================================

function renderRows(indices){

  const container=$("#itemList");

  if(!indices.length){

    container.innerHTML=`
      <div class="empty-search">
        Koi saman nahi mila
      </div>
    `;

    return;
  }

  container.innerHTML=indices.map(i=>{

    const it=ALL_ITEMS[i];

    return `
      <div class="row" id="r${i}">

        <label>
          <input type="checkbox" data-i="${i}">
          ${safeText(it[0])}
        </label>

        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          id="q${i}"
          placeholder="0"
        >

        <span class="unit">
          ${safeText(it[1])}
        </span>

      </div>
    `;

  }).join("");


  // Restore checkbox and quantity
  indices.forEach(i=>{

    const checkbox=$(`#r${i} input[type="checkbox"]`);
    const quantity=$("#q"+i);

    if(selectedItems[i]){

      checkbox.checked=true;

      $("#r"+i).classList.add("on");

      quantity.value=selectedItems[i].qty;

    }


    // Checkbox change
    checkbox.onchange=()=>{

      if(checkbox.checked){

        selectedItems[i]={
          qty:quantity.value
        };

        $("#r"+i).classList.add("on");

        quantity.focus();

      }else{

        delete selectedItems[i];

        $("#r"+i).classList.remove("on");

        quantity.value="";

      }

    };


    // Quantity change
    quantity.oninput=()=>{

      quantity.value=quantity.value.replace(/\D/g,"");

      if(selectedItems[i]){
        selectedItems[i].qty=quantity.value;
      }

    };

  });

}


// ======================================
// NEW ENTRY
// ======================================

function entry(){

  // New entry starts with fresh selection
  selectedItems={};

  app.innerHTML=`

    <header id="back">
      ‹ Saman chuniye
    </header>

    <input
      id="s"
      type="search"
      placeholder="Search... जैसे Aa, Py, Sha, Mag"
      autocomplete="off"
    >

    <button class="add-item" id="addItem">
      ＋ सामान जोड़ें
    </button>

    <div id="itemList"></div>

    <div class="bar">
      <button class="btn" id="exp">
        Export / Share
      </button>
    </div>

  `;

  $("#back").onclick=home;

  $("#addItem").onclick=addItem;


  // Show all items initially
  renderRows(ALL_ITEMS.map((item,i)=>i));


  // Live Search
  $("#s").oninput=e=>{

    const results=searchItems(e.target.value);

    // Only visible rows are recreated.
    // Selected data remains in selectedItems.
    renderRows(results);

  };


  $("#exp").onclick=exportList;

}


// ======================================
// DRAW IMAGE - AUTO ADJUSTABLE HEIGHT
// ======================================

function draw(rows,dateStr){

  const W=1080;
  const S=2262/W;

  const top=350;
  const n=rows.length;
  const rh=75;
  const extraRows=3;

  // Actual rows + 3 extra empty rows
  const H=top+((n+extraRows)*rh)+10;

  const c=document.createElement("canvas");

  c.width=2262;
  c.height=Math.ceil(H*S);

  const g=c.getContext("2d");

  g.scale(S,S);

  const L=80;
  const R=1000;

  const HF='"Noto Sans Devanagari","Noto Sans",sans-serif';
  const SF='"Noto Serif",Georgia,"Times New Roman",serif';


  // Background
  g.fillStyle="#f5f3f8";
  g.fillRect(0,0,W,H);


  // Shop name
  g.fillStyle="#0b4f8f";
  g.textBaseline="alphabetic";
  g.textAlign="left";

  g.font=`bold 84px ${SF}`;
  g.fillText(SHOP,L,120);

  g.font=`bold 36px ${SF}`;
  g.fillText(PLACE,L,175);

  g.fillRect(L,195,R-L,4);


  // Date box
  g.fillStyle="#fff";
  g.fillRect(L,212,R-L,52);

  g.strokeStyle="#777";
  g.lineWidth=1.5;
  g.strokeRect(L,212,R-L,52);

  g.fillStyle="#000";
  g.font=`bold 30px ${SF}`;

  g.fillText("Date:",L+20,247);
  g.fillText("Total Items :",650,247);

  g.font=`30px ${SF}`;

  g.fillText(dateStr,L+135,247);
  g.fillText(String(rows.length),880,247);


  // Table heading - original font style
  g.fillStyle="#08558f";
  g.fillRect(L,280,R-L,70);

  g.fillStyle="#fff";
  g.font=`44px ${SF}`;
  g.textAlign="left";

  g.fillText("No.",L+25,328);
  g.fillText("Name List",L+130,328);

  g.textAlign="right";

  g.fillText("Quantity",860,328);
  g.fillText("Unit",R-15,328);


  // List rows
  const fs=40;
  const listFs=44;

  const totalRows=n+extraRows;

  for(let i=0;i<totalRows;i++){

    const y=top+i*rh;
    const by=y+rh*0.72;

    g.fillStyle=i%2?"#e6eff7":"#cfd8e6";
    g.fillRect(L,y,R-L,rh);

    const r=rows[i];

    if(!r)continue;

    g.fillStyle="#111";


    // Serial number - bold and bigger
    g.font=`bold ${listFs}px ${HF}`;
    g.textAlign="right";

    g.fillText(String(i+1),175,by);


    // Item name - bold and bigger
    g.font=`bold ${listFs}px ${HF}`;
    g.textAlign="left";

    g.fillText(r.name,200,by,440);


    // Dash
    g.font=`${fs}px ${HF}`;
    g.fillText("-",650,by);


    // Quantity
    g.textAlign="right";
    g.fillText(r.qty,860,by);


    // Unit
    g.font=`bold ${fs}px ${HF}`;
    g.fillText(r.unit,R-15,by);

  }

  return c.toDataURL("image/jpeg",0.98).split(",")[1];

}


// ======================================
// EXPORT / SHARE
// ======================================

async function exportList(){

  const rows=[];


  // Collect ALL selected items,
  // including items hidden by current search
  Object.keys(selectedItems).forEach(key=>{

    const i=Number(key);

    rows.push({

      name:ALL_ITEMS[i][0],

      unit:ALL_ITEMS[i][1],

      qty:selectedItems[i].qty||"-"

    });

  });


  if(!rows.length){

    alert("Kam se kam ek saman tick kijiye");

    return;

  }


  const d=new Date();

  const dateStr=d.toLocaleDateString("en-GB",{
    day:"numeric",
    month:"long",
    year:"numeric"
  });

  const b64=draw(rows,dateStr);

  const id=Date.now();


  try{

    const f=await FS().writeFile({

      path:`share_${id}.jpg`,

      data:b64,

      directory:"CACHE"

    });


    await P().Share.share({

      title:"Saman List",

      files:[f.uri]

    });


    await FS().writeFile({

      path:`lists/${id}.jpg`,

      data:b64,

      directory:"DATA",

      recursive:true

    });


    const h=hist();

    h.unshift({

      id,

      date:dateStr+" "+d.toLocaleTimeString("en-GB",{

        hour:"2-digit",

        minute:"2-digit"

      }),

      count:rows.length

    });


    localStorage.setItem(
      "hist",
      JSON.stringify(h)
    );


    home();


  }catch(e){

    if(!/cancel/i.test(String(e&&e.message||e))){

      alert("Error: "+e);

    }

  }

}


// ======================================
// START APP
// ======================================

home();

</script>
