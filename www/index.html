<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saman List</title>

<style>
:root{
  --primary:#607D8B;
  --dark-primary:#455F6D;
  --bg:#EAF1F4;
  --card:#F8FAFB;
  --soft-blue:#DCE7EC;
  --text:#202C35;
  --sec-text:#647783;
  --divider:#C7D6DE;
  --delete:#E76B64;
  --app-bg:url("app_bg.png");
  --header-pattern:url("pattern.png");
  --float-line-shadow:0 3px 0 rgba(32, 44, 53, 0.24), 0 1px 0 rgba(32, 44, 53, 0.14);
  --neu-card:7px 7px 14px rgba(155, 178, 191, 0.42), -7px -7px 14px rgba(255, 255, 255, 0.90);
  --neu-sm:4px 4px 10px rgba(155, 178, 191, 0.38), -4px -4px 10px rgba(255, 255, 255, 0.88);
  --neu-inset:inset 3px 3px 6px rgba(155, 178, 191, 0.42), inset -3px -3px 6px rgba(255, 255, 255, 0.85);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans Devanagari","Segoe UI",sans-serif;
  background-color:var(--bg);
  background-image:var(--app-bg);
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
  color:var(--text);
  padding-bottom:24px;
  min-height:100vh;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:12px 14px 28px;
}

/* Top Heading Box: Solid White Base + 25% Opacity pattern.png + Fine Non-Blur Dark Line Shadow */
.top-card{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-radius:20px;
  background-color:var(--card);
  border:1px solid rgba(255, 255, 255, 0.92);
  box-shadow:var(--float-line-shadow);
}
.top-card::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:var(--header-pattern);
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
  mix-blend-mode:screen;
  opacity:0.25;
  pointer-events:none;
  z-index:0;
}
.top-card > *{
  position:relative;
  z-index:1;
}
.shop-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.shop-logo-wrap{
  width:66px;
  height:66px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--card);
  border:1.5px solid var(--soft-blue);
  box-shadow:0 2px 0 rgba(32, 44, 53, 0.18);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.shop-logo-img{
  width:66px;
  height:66px;
  border-radius:50%;
  object-fit:cover;
  display:block;
}
.shop-name{
  font-size:20.5px;
  font-weight:700;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.shop-place{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:13.5px;
  color:var(--sec-text);
  margin-top:3px;
  font-weight:700;
}
.pin-icon{
  width:14px;
  height:14px;
  fill:var(--dark-primary);
  flex-shrink:0;
}
.cart-box{
  position:relative;
  display:flex;
  align-items:center;
  padding-left:12px;
  border-left:1px solid var(--divider);
  flex-shrink:0;
}
.cart-badge{
  position:absolute;
  top:-6px;
  right:-6px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:99px;
  background:var(--dark-primary);
  color:var(--card);
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 1px 0 rgba(32, 44, 53, 0.25);
}

/* Date & Kul Suchi Bar */
.date-bar{
  position:relative;
  overflow:hidden;
  width:100%;
  height:52px;
  margin:12px 0 10px;
  border-radius:999px;
  background-color:var(--card);
  border:1px solid rgba(255, 255, 255, 0.92);
  box-shadow:var(--float-line-shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px;
}
.date-bar > *{
  position:relative;
  z-index:1;
}
.date-left{
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:14px;
  color:var(--dark-primary);
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
}
.date-left svg{
  width:20px;
  height:20px;
  fill:var(--dark-primary);
  flex-shrink:0;
}
.count-pill{
  height:100%;
  padding:0 16px 0 18px;
  border-radius:999px;
  background:var(--dark-primary);
  color:var(--card);
  font-size:15.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 1px 0 rgba(32, 44, 53, 0.25);
  white-space:nowrap;
}
.count-pill svg{
  width:19px;
  height:19px;
  fill:var(--card);
  flex-shrink:0;
}

/* Table Heading Box */
.th-bar{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:44px 1fr 82px 68px;
  align-items:center;
  background-color:var(--primary);
  color:var(--card);
  border-radius:16px;
  padding:11px 14px;
  font-size:15.5px;
  font-weight:700;
  border:1px solid rgba(255, 255, 255, 0.72);
  box-shadow:var(--float-line-shadow);
  margin-bottom:10px;
}
.th-bar > *{
  position:relative;
  z-index:1;
}
.th-c{text-align:center}

/* Search & Add */
#s{
  display:block;
  width:100%;
  margin:10px 0;
  padding:11px 14px;
  font-size:16.5px;
  background:var(--card);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.85);
  border-radius:16px;
  box-shadow:var(--neu-inset);
  outline:none;
}
#s:focus{
  border-color:var(--primary);
}
.add-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  margin:8px 0 12px;
  padding:11px 14px;
  border:1px solid rgba(255,255,255,0.88);
  border-radius:16px;
  background:var(--card);
  color:var(--dark-primary);
  font-size:16.5px;
  font-weight:700;
  box-shadow:var(--neu-card);
  cursor:pointer;
}

/* Neomorphic Item Rows */
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  margin-bottom:10px;
  border-radius:16px;
  background:var(--card);
  border:1px solid rgba(255,255,255,0.88);
  box-shadow:var(--neu-card);
}
.row.on{
  background:var(--soft-blue);
  border-color:rgba(255,255,255,0.92);
  box-shadow:var(--neu-inset);
}
.row label{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  line-height:1.3;
  min-width:0;
}
.row input[type=checkbox]{
  width:22px;
  height:22px;
  accent-color:var(--dark-primary);
  flex-shrink:0;
}
.row .qty-input{
  display:none;
  width:76px;
  font-size:18px;
  font-weight:700;
  padding:6px 8px;
  text-align:center;
  border:1.5px solid var(--dark-primary);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  box-shadow:var(--neu-inset);
  outline:none;
}
.row.on .qty-input{

}
.unit{
  min-width:62px;
  text-align:center;
  color:var(--dark-primary);
  font-weight:700;
  font-size:16px;
  background:var(--bg);
  border:1px solid rgba(255,255,255,0.85);
  box-shadow:var(--neu-sm);
  padding:4px 8px;
  border-radius:12px;
}

/* Primary & History Cards */
.btn{
  display:block;
  width:100%;
  margin:14px 0;
  padding:14px;
  border:1px solid rgba(255,255,255,0.65);
  border-radius:16px;
  background:var(--dark-primary);
  color:var(--card);
  font-size:17.5px;
  font-weight:700;
  box-shadow:var(--neu-card);
  cursor:pointer;
}
.card{
  margin:10px 0;
  padding:12px 14px;
  background:var(--card);
  border:1px solid rgba(255,255,255,0.88);
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:var(--neu-card);

.card .info{

  display:flex;
  flex-direction:column;
  gap:3px;

.card .info b{font-size:17.5px}
.card .info small{color:var(--sec-text);font-size:14.5px;font-weight:600}

  padding:7px 11px;
  font-size:14.5px;
  font-weight:700;
  box-shadow:var(--neu-sm);

  justify-content:space-between;
  background:var(--card);
  border:1px solid rgba(255,255,255,0.88);
  border-radius:16px;
  padding:11px 14px;
  margin-bottom:10px;
  font-weight:700;
  color:var(--dark-primary);
  box-shadow:var(--neu-card);

.back-btn{
  background:none;
  border:0;
  color:var(--dark-primary);
  font-size:16.5px;
  font-weight:700;
  padding:0;

.bar{
  position:sticky;
  bottom:0;
  background:rgba(234,241,244,0.82);

  padding:22px 10px;
  font-weight:700;
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--neu-card);
}
</style>
</head>

// Custom phonetic search normalization
// F=फ, Ph=फ, Sh=श/ष, A=अ/आ, Ay=ए, U=उ/ऊ
function normalizeCustomSearch(raw){
  let s=String(raw||"").toLowerCase().trim();

  s=s
    .replace(/ph/g,"f")
    .replace(/sh/g,"s")
    .replace(/ay/g,"e")
    .replace(/aa/g,"a")
    .replace(/ee/g,"i")
    .replace(/ii/g,"i")
    .replace(/oo/g,"u")
    .replace(/uu/g,"u");

  const hindiMap={
    "फ":"f",
    "श":"s","ष":"s","स":"s",
    "अ":"a","आ":"a","ा":"a",
    "ए":"e","े":"e","ै":"e",
    "उ":"u","ऊ":"u","ु":"u","ू":"u",
    "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
    "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny",
    "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
    "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
    "प":"p","ब":"b","भ":"bh","म":"m",
    "य":"y","र":"r","ल":"l","व":"v",
    "ह":"h","इ":"i","ई":"i","ि":"i","ी":"i",
    "ऋ":"ri","ृ":"ri","ओ":"o","ो":"o","औ":"au","ौ":"au",
    "ं":"n","ँ":"n","ः":"h","़":"","्":""
  };

  let out="";
  for(const ch of Array.from(s)){
    out+=Object.prototype.hasOwnProperty.call(hindiMap,ch)?hindiMap[ch]:ch;
  }

  return out.replace(/[^a-z0-9]/g,"");
}

function searchItems(value){
  const raw=value.trim();
  if(!raw)return ALL_ITEMS.map((_,i)=>i);

  const qNorm=normalizeCustomSearch(raw);
  const qLower=raw.toLowerCase();
  const results=[];

  ALL_ITEMS.forEach((item,i)=>{
    const itemNameLower=item[0].toLowerCase();
    const itemUnitLower=item[1].toLowerCase();
    const itemNorm=normalizeCustomSearch(item[0]);
    const unitNorm=normalizeCustomSearch(item[1]);

    const matched=
      itemNameLower.includes(qLower) ||
      itemUnitLower.includes(qLower) ||
      (qNorm && (itemNorm.includes(qNorm) || unitNorm.includes(qNorm)));

    if(matched)results.push(i);
  });

  return results;
}

function addItem(){
  const name=prompt("नए सामान का नाम लिखें:");
  if(!name||!name.trim())return;
  const cleanName=name.trim();
  const exists=ALL_ITEMS.some(x=>x[0].toLowerCase()===cleanName.toLowerCase());
  if(exists){alert("यह सामान पहले से सूची में है");return;}
  const unit=prompt("Unit लिखें (जैसे: KG, नग, पैकेट, पत्ता, पूड़ा, पेटी, टिन):","नग");
  if(!unit||!unit.trim())return;
  const item=[cleanName,unit.trim()];
  const custom=getCustomItems();
  custom.push(item);
  localStorage.setItem("customItems",JSON.stringify(custom));
  ALL_ITEMS.push(item);
  const currentSearch=$("#s")?$("#s").value:"";
  renderRows(searchItems(currentSearch));
}

function renderRows(indices){
  const container=$("#itemList");
  if(!indices.length){
    container.innerHTML=`<div class="empty-search">कोई सामान नहीं मिला</div>`;
    updateTickCount();
    return;
  }
  container.innerHTML=indices.map((i,idx)=>`
    <div class="row ${selectedItems[i]?"on":""}" id="r${i}">
      <label>
        <input type="checkbox" class="item-chk" data-i="${i}" ${selectedItems[i]?"checked":""}>
        <span>${String(idx+1).padStart(2,"0")}. ${safeText(ALL_ITEMS[i][0])}</span>
      </label>
      <input
        type="text"
        class="qty-input"
        inputmode="decimal"
        id="q${i}"
        placeholder="Qty"
        value="${selectedItems[i]?safeText(selectedItems[i].qty):""}"
      >
      <span class="unit">${safeText(ALL_ITEMS[i][1])}</span>
    </div>
  `).join("");

  indices.forEach(i=>{
    const rowEl=$("#r"+i);
    const checkbox=$(`#r${i} .item-chk`);
    const quantity=$("#q"+i);

    checkbox.onchange=()=>{
      if(checkbox.checked){
        selectedItems[i]={qty:quantity.value};
        rowEl.classList.add("on");
        setTimeout(()=>quantity.focus(),40);
      }else{
        delete selectedItems[i];
        rowEl.classList.remove("on");
        quantity.value="";
      }
      updateTickCount();
    };

    quantity.oninput=()=>{
      let clean=quantity.value.replace(/[^0-9.]/g,"");
      const parts=clean.split(".");
      if(parts.length>2){
        clean=parts[0]+"."+parts.slice(1).join("");
      }
      quantity.value=clean;
      if(!selectedItems[i]){
        selectedItems[i]={qty:clean};
        checkbox.checked=true;
        rowEl.classList.add("on");
        updateTickCount();
      }else{
        selectedItems[i].qty=clean;
      }
    };
  });

  updateTickCount();
}

function loadImageFile(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

function drawRoundedRectPath(g, x, y, w, h, r){
  const radius = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + radius, y);
  g.arcTo(x + w, y, x + w, y + h, radius);
  g.arcTo(x + w, y + h, x, y + h, radius);
  g.arcTo(x, y + h, x, y, radius);
  g.arcTo(x, y, x + w, y, radius);
  g.closePath();
}

// Draws solid white card with pattern.png at 25% opacity using 'screen' blend mode
// and fine non-blur dark line shadow below
function drawTopPatternCard(g, x, y, w, h, r, patternImg, alpha = 0.25){
  // Fine crisp dark line shadow below (no blur)
  drawRoundedRectPath(g, x, y + 3, w, h, r);
  g.fillStyle = "rgba(32, 44, 53, 0.24)";
  g.fill();

  drawRoundedRectPath(g, x, y + 1.5, w, h, r);
  g.fillStyle = "rgba(32, 44, 53, 0.13)";
  g.fill();

  g.save();
  drawRoundedRectPath(g, x, y, w, h, r);
  g.clip();

  // Solid card base
  g.fillStyle = "#F8FAFB";
  g.fillRect(x, y, w, h);

  // Draw pattern.png with screen composite so black disappears and flowers/leaves show lightly
  if(patternImg){
    g.save();
    g.globalCompositeOperation = "screen";
    g.globalAlpha = alpha;
    g.drawImage(patternImg, x, y, w, h);
    g.restore();
  }

  g.restore();

  drawRoundedRectPath(g, x, y, w, h, r);
  g.strokeStyle = "rgba(255, 255, 255, 0.92)";
  g.lineWidth = 2;
  g.stroke();
}

function drawSolidWithLightPatternBox(g, x, y, w, h, r, solidFill, bgImg, fullDraw, patternAlpha = 0.14, strokeStyle = "rgba(255,255,255,0.92)"){
  drawRoundedRectPath(g, x, y + 3, w, h, r);
  g.fillStyle = "rgba(32, 44, 53, 0.24)";
  g.fill();

  drawRoundedRectPath(g, x, y + 1.5, w, h, r);
  g.fillStyle = "rgba(32, 44, 53, 0.13)";
  g.fill();

  g.save();
  drawRoundedRectPath(g, x, y, w, h, r);
  g.clip();

  g.fillStyle = solidFill;
  g.fillRect(x, y, w, h);

  if(bgImg && fullDraw && fullDraw.dw > 0 && fullDraw.dh > 0 && patternAlpha > 0){
    const scaleX = bgImg.width / fullDraw.dw;
    const scaleY = bgImg.height / fullDraw.dh;
    const sx = Math.max(0, (x - fullDraw.dx) * scaleX);
    const sy = Math.max(0, (y - fullDraw.dy) * scaleY);
    const sw = Math.min(bgImg.width - sx, w * scaleX);
    const sh = Math.min(bgImg.height - sy, h * scaleY);
    if(sw > 0 && sh > 0){
      g.save();
      g.globalAlpha = patternAlpha;
      g.drawImage(bgImg, sx, sy, sw, sh, x, y, w, h);
      g.restore();
    }
  }

  g.restore();

  if(strokeStyle){
    drawRoundedRectPath(g, x, y, w, h, r);
    g.strokeStyle = strokeStyle;
    g.lineWidth = 2;
    g.stroke();
  }
}

function drawNeuRowBox(g, x, y, w, h, r, fillStyle){
  g.save();
  g.shadowColor = "rgba(255, 255, 255, 0.94)";
  g.shadowBlur = 14;
  g.shadowOffsetX = -6;
  g.shadowOffsetY = -6;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  g.save();
  g.shadowColor = "rgba(155, 178, 191, 0.48)";
  g.shadowBlur = 14;
  g.shadowOffsetX = 6;
  g.shadowOffsetY = 6;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  drawRoundedRectPath(g, x, y, w, h, r);
  g.strokeStyle = "rgba(255,255,255,0.92)";
  g.lineWidth = 2;
  g.stroke();
}

function drawCanvasLocationPin(g, cx, cy, size = 24, color = "#455F6D"){
  g.save();
  g.fillStyle = color;
  const r = size * 0.34;
  const topY = cy - size * 0.42;
  g.beginPath();
  g.arc(cx, topY + r, r, Math.PI * 0.85, Math.PI * 2.15);
  g.lineTo(cx, cy + size * 0.46);
  g.closePath();
  g.fill();

  g.beginPath();
  g.arc(cx, topY + r, r * 0.42, 0, Math.PI * 2);
  g.fillStyle = "#F8FAFB";
  g.fill();
  g.restore();
}

function drawCanvasCalendarIcon(g, x, y, size = 28, color = "#455F6D"){
  g.save();
  g.fillStyle = color;
  const s = size / 24;
  g.translate(x, y);
  g.scale(s, s);
  g.beginPath();
  g.moveTo(19, 3);
  g.lineTo(18, 3);
  g.lineTo(18, 1);
  g.lineTo(16, 1);
  g.lineTo(16, 3);
  g.lineTo(8, 3);
  g.lineTo(8, 1);
  g.lineTo(6, 1);
  g.lineTo(6, 3);
  g.lineTo(5, 3);
  g.arc(5, 5, 2, Math.PI, Math.PI * 1.5);
  g.lineTo(3, 19);
  g.arc(5, 19, 2, Math.PI * 0.5, Math.PI);
  g.lineTo(19, 21);
  g.arc(19, 19, 2, 0, Math.PI * 0.5);
  g.lineTo(21, 5);
  g.arc(19, 5, 2, Math.PI * 1.5, Math.PI * 2);
  g.closePath();
  g.fill();

  g.fillStyle = "#F8FAFB";
  g.fillRect(5, 9, 14, 10);

  g.fillStyle = color;
  g.fillRect(7, 11, 2.5, 2.5);
  g.fillRect(10.75, 11, 2.5, 2.5);
  g.fillRect(14.5, 11, 2.5, 2.5);
  g.fillRect(7, 15, 2.5, 2.5);
  g.fillRect(10.75, 15, 2.5, 2.5);
  g.restore();
}

function drawCanvasThreeLinesIcon(g, x, y, size = 26, color = "#FFFFFF"){
  g.save();
  g.fillStyle = color;
  const s = size / 24;
  g.translate(x, y);
  g.scale(s, s);
  g.fillRect(3, 5.5, 2.5, 2.5);
  g.fillRect(7.5, 5.5, 13.5, 2.5);
  g.fillRect(3, 10.75, 2.5, 2.5);
  g.fillRect(7.5, 10.75, 13.5, 2.5);
  g.fillRect(3, 16, 2.5, 2.5);
  g.fillRect(7.5, 16, 13.5, 2.5);
  g.restore();
}

function drawCanvasCartIcon(g, cx, cy, size = 40, color = "#455F6D"){
  g.save();
  g.fillStyle = color;
  const s = size / 24;
  g.translate(cx - (size / 2), cy - (size / 2));
  g.scale(s, s);

  g.beginPath();
  g.arc(7, 20, 2, 0, Math.PI * 2);
  g.arc(17, 20, 2, 0, Math.PI * 2);
  g.fill();

  g.beginPath();
  g.moveTo(7.17, 14.75);
  g.lineTo(7.2, 14.63);
  g.lineTo(8.1, 13);
  g.lineTo(15.55, 13);
  g.lineTo(17.3, 11.97);
  g.lineTo(20.88, 5.48);
  g.arc(20, 4, 1, 0, Math.PI * 1.5);
  g.lineTo(5.21, 4);
  g.lineTo(4.27, 2);
  g.lineTo(1, 2);
  g.lineTo(1, 4);
  g.lineTo(3, 4);
  g.lineTo(6.6, 11.59);
  g.lineTo(5.25, 14.03);
  g.arc(7, 17, 2, Math.PI * 0.5, Math.PI);
  g.lineTo(19, 17);
  g.lineTo(19, 15);
  g.lineTo(7.42, 15);
  g.arc(7.17, 14.75, 0.25, 0, Math.PI * 2);
  g.closePath();
  g.fill();

  g.restore();
}

async function draw4K(rows, dateStr){
  const W = 1080;
  const targetWidth = 3840;
  const S = targetWidth / W;

  const extraRows = typeof EXTRA_ROWS === "number" ? EXTRA_ROWS : 4;
  const startY = 374;
  const rowH = 104;
  const pillHeight = 84;
  const totalSlots = rows.length + extraRows;
  const H = startY + (totalSlots * rowH) + 36;

  const c = document.createElement("canvas");
  c.width = targetWidth;
  c.height = Math.ceil(H * S);

  const g = c.getContext("2d");
  g.scale(S, S);

  const L = 36;
  const R = W - 36;
  const boxW = R - L;
  const HF = '"Noto Sans Devanagari","Segoe UI",sans-serif';

  // 1. Background
  g.fillStyle = "#EAF1F4";
  g.fillRect(0, 0, W, H);

  const [bgImg, iconSvgImg, patternImg] = await Promise.all([
    loadImageFile("app_bg.png"),
    loadImageFile("icon.svg"),
    loadImageFile("pattern.png")
  ]);

  let fullDraw = null;
  if(bgImg){
    const imgRatio = bgImg.width / bgImg.height;
    const canvasRatio = W / H;
    let dw = W, dh = H, dx = 0, dy = 0;
    if(imgRatio > canvasRatio){
      dh = H;
      dw = H * imgRatio;
      dx = (W - dw) / 2;
    }else{
      dw = W;
      dh = W / imgRatio;
      dy = 0;
    }
    fullDraw = { dx, dy, dw, dh };
    g.drawImage(bgImg, dx, dy, dw, dh);
  }

  // 2. Top Heading Box with pattern.png (25% opacity) + Fine Non-Blur Dark Line Shadow
  const topY = 24;
  const topH = 156;
  drawTopPatternCard(g, L, topY, boxW, topH, 28, patternImg, 0.25);

  // Bigger Round Logo (icon.svg)
  const badgeCx = L + 88;
  const badgeCy = topY + topH / 2;
  const logoRadius = 56;

  drawRoundedRectPath(g, badgeCx - logoRadius, badgeCy - logoRadius + 2, logoRadius * 2, logoRadius * 2, logoRadius);
  g.fillStyle = "rgba(32, 44, 53, 0.16)";
  g.fill();

  g.save();
  g.beginPath();
  g.arc(badgeCx, badgeCy, logoRadius, 0, Math.PI * 2);
  g.fillStyle = "#F8FAFB";
  g.fill();
  g.clip();

  if(iconSvgImg){
    g.drawImage(iconSvgImg, badgeCx - logoRadius, badgeCy - logoRadius, logoRadius * 2, logoRadius * 2);
  }else{
    g.fillStyle = "#455F6D";
    g.fillRect(badgeCx - 24, badgeCy - 16, 48, 32);
  }
  g.restore();

  g.beginPath();
  g.arc(badgeCx, badgeCy, logoRadius, 0, Math.PI * 2);
  g.strokeStyle = "#DCE7EC";
  g.lineWidth = 2.5;
  g.stroke();

  // Shop Name & Location
  g.fillStyle = "#202C35";
  g.textBaseline = "alphabetic";
  g.textAlign = "left";
  g.font = `bold 49px ${HF}`;
  g.fillText(SHOP, L + 162, topY + 70);

  drawCanvasLocationPin(g, L + 174, topY + 108, 27, "#455F6D");
  g.fillStyle = "#647783";
  g.font = `bold 29px ${HF}`;
  g.fillText(PLACE, L + 195, topY + 117);

  // Divider & Exact Trolley Symbol + Count Badge
  const divX = R - 134;
  g.strokeStyle = "#C7D6DE";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(divX, topY + 24);
  g.lineTo(divX, topY + topH - 24);
  g.stroke();

  const cartCx = R - 68;
  const cartCy = topY + topH / 2 + 4;
  drawCanvasCartIcon(g, cartCx, cartCy, 42, "#455F6D");

  g.beginPath();
  g.arc(cartCx + 17, cartCy - 17, 18.5, 0, Math.PI * 2);
  g.fillStyle = "#455F6D";
  g.fill();
  g.fillStyle = "#FFFFFF";
  g.font = `bold 20.5px ${HF}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(String(rows.length), cartCx + 17, cartCy - 16);

  // 3. Date & Total List Bar
  const metaY = 194;
  const metaH = 66;
  drawSolidWithLightPatternBox(g, L, metaY, boxW, metaH, metaH / 2, "#F8FAFB", bgImg, fullDraw, 0.12, "rgba(255, 255, 255, 0.92)");

  drawCanvasCalendarIcon(g, L + 28, metaY + (metaH - 28) / 2, 28, "#455F6D");
  g.fillStyle = "#455F6D";
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.font = `bold 31px ${HF}`;
  g.fillText(`दिनांक: ${dateStr}`, L + 68, metaY + metaH / 2 + 1);

  const pillW = 304;
  const pillX = R - pillW - 4;
  drawRoundedRectPath(g, pillX, metaY + 4, pillW, metaH - 8, (metaH - 8) / 2);
  g.fillStyle = "#455F6D";
  g.fill();

  g.fillStyle = "#FFFFFF";
  g.font = `bold 30.5px ${HF}`;
  g.textAlign = "left";
  g.fillText(`कुल सूची: ${rows.length}`, pillX + 24, metaY + metaH / 2 + 1);
  drawCanvasThreeLinesIcon(g, pillX + pillW - 44, metaY + (metaH - 24) / 2, 24, "#FFFFFF");

  // 4. Table Heading Box
  const thY = 276;
  const thH = 78;
  drawSolidWithLightPatternBox(g, L, thY, boxW, thH, 24, "#607D8B", bgImg, fullDraw, 0.10, "rgba(255, 255, 255, 0.72)");

  g.fillStyle = "#FFFFFF";
  g.font = `bold 32.5px ${HF}`;
  g.textBaseline = "middle";
  g.textAlign = "left";
  g.fillText("No.", L + 32, thY + thH / 2 + 1);
  g.fillText("सामान सूची", L + 146, thY + thH / 2 + 1);

  const qtyColX = 765;
  const unitColX = R - 95;
  g.textAlign = "center";
  g.fillText("Quantity", qtyColX, thY + thH / 2 + 1);
  g.fillText("Unit", unitColX, thY + thH / 2 + 1);

  // 5. Bold Kramank, Saman List, Quantity & Unit
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const y = startY + (i * rowH);
    const cy = y + (pillHeight / 2);

    drawNeuRowBox(g, L, y, boxW, pillHeight, 24, "#F8FAFB");

    g.fillStyle = "#455F6D";
    g.font = `bold 35px ${HF}`;
    g.textAlign = "left";
    g.textBaseline = "middle";
    g.fillText(String(i + 1).padStart(2, "0"), L + 32, cy + 1);

    g.fillStyle = "#202C35";
    g.font = `bold 41px ${HF}`;
    g.fillText(r.name, L + 146, cy + 1, 515);

    g.fillStyle = "#202C35";
    g.font = `bold 39px ${HF}`;
    g.textAlign = "center";
    g.fillText(String(r.qty), qtyColX, cy + 1);

    const uW = 136;
    const uH = 50;
    const uX = unitColX - (uW / 2);
    drawRoundedRectPath(g, uX, cy - (uH / 2), uW, uH, 16);
    g.fillStyle = "#EAF1F4";
    g.fill();
    g.strokeStyle = "#C7D6DE";
    g.lineWidth = 1.5;
    g.stroke();

    g.fillStyle = "#455F6D";
    g.font = `bold 28px ${HF}`;
    g.fillText(String(r.unit), uX + (uW / 2), cy + 1);
  }

  return c.toDataURL("image/jpeg", 0.98).split(",")[1];
}

async function exportList(){
  const rows=[];
  Object.keys(selectedItems).forEach(key=>{
    const i=Number(key);
    rows.push({
      name:ALL_ITEMS[i][0],
      unit:ALL_ITEMS[i][1],
      qty:selectedItems[i].qty||"-"
    });
  });

  if(!rows.length){
    alert("कम से कम एक सामान tick करें");
    return;
  }

  const d=new Date();
  const dateStr=getAutoDate();
  const b64=await draw4K(rows,dateStr);
  const id=Date.now();

  try{
    if(P() && P().Share && FS()){
      const f=await FS().writeFile({
        path:`share_${id}.jpg`,
        data:b64,
        directory:"CACHE"
      });
      await P().Share.share({
        title:"Saman List",
        files:[f.uri]
      });
      await FS().writeFile({
        path:`lists/${id}.jpg`,
        data:b64,
        directory:"DATA",
        recursive:true
      });
    }else{
      const link=document.createElement("a");
      link.href="data:image/jpeg;base64,"+b64;
      link.download=`saman_list_${id}.jpg`;
      link.click();
    }

    const h=hist();
    h.unshift({
      id,
      date:dateStr+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      count:rows.length
    });
    localStorage.setItem("hist",JSON.stringify(h));
    home();
  }catch(e){
    if(!/cancel/i.test(String(e&&e.message||e))){
      alert("Error: "+e);
    }
  }
}
