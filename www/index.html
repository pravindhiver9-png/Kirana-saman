<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saman List</title>

<style>
:root{
  --primary:#607D8B;
  --dark-primary:#455F6D;
  --bg:#EAF1F4;
  --card:#F8FAFB;
  --soft-blue:#DCE7EC;
  --text:#202C35;
  --sec-text:#647783;
  --divider:#C7D6DE;
  --delete:#E76B64;
  --app-bg:url("app_bg.png");
  --dark-around:0 0 14px rgba(32, 44, 53, 0.30), 0 6px 16px rgba(32, 44, 53, 0.24);
  --dark-around-sm:0 0 10px rgba(32, 44, 53, 0.24), 0 4px 10px rgba(32, 44, 53, 0.18);
  --neu-inset:inset 3px 3px 7px rgba(32, 44, 53, 0.22), inset -3px -3px 7px rgba(255, 255, 255, 0.85);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans Devanagari","Segoe UI",sans-serif;
  background-color:var(--bg);
  background-image:var(--app-bg);
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
  color:var(--text);
  padding-bottom:24px;
  min-height:100vh;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:12px 14px 28px;
}

/* Top Shop & Logo Card - Magnifies Exact Top Background Area */
.top-card{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-radius:24px;
  background-color:rgba(248,250,251,0.55);
  background-image:
    linear-gradient(145deg, rgba(248,250,251,0.58), rgba(220,231,236,0.52)),
    var(--app-bg);
  background-size:100% 100%, 130% auto;
  background-position:center, center 0%;
  border:1.5px solid rgba(255,255,255,0.88);
  box-shadow:var(--dark-around), inset 0 1px 1px rgba(255,255,255,0.9);
}
.top-card > *{
  position:relative;
  z-index:1;
}
.shop-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.shop-logo-wrap{
  width:60px;
  height:60px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--card);
  border:1.5px solid var(--soft-blue);
  box-shadow:var(--dark-around-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.shop-logo{
  width:60px;
  height:60px;
  display:block;
}
.shop-name{
  font-size:20px;
  font-weight:700;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,0.85);
}
.shop-place{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:13px;
  color:var(--sec-text);
  margin-top:3px;
  font-weight:600;
}
.pin-icon{
  width:14px;
  height:14px;
  fill:var(--dark-primary);
  flex-shrink:0;
}
.cart-box{
  position:relative;
  display:flex;
  align-items:center;
  padding-left:12px;
  border-left:1.2px solid var(--divider);
  flex-shrink:0;
}
.cart-badge{
  position:absolute;
  top:-6px;
  right:-6px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:99px;
  background:linear-gradient(145deg, var(--primary), var(--dark-primary));
  color:var(--card);
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 8px rgba(32,44,53,0.35);
}

/* Date & Kul Suchi Bar */
.date-bar{
  position:relative;
  overflow:hidden;
  width:100%;
  height:52px;
  margin:12px 0 10px;
  border-radius:999px;
  background-color:rgba(248,250,251,0.78);
  background-image:
    linear-gradient(145deg, rgba(248,250,251,0.82), rgba(220,231,236,0.76)),
    var(--app-bg);
  background-size:100% 100%, 135% auto;
  background-position:center, center 12%;
  border:1.5px solid rgba(255,255,255,0.9);
  box-shadow:var(--dark-around), inset 0 1px 1px rgba(255,255,255,0.9);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px;
}
.date-left{
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:14px;
  color:var(--dark-primary);
  font-size:15.5px;
  font-weight:700;
  white-space:nowrap;
}
.date-left svg{
  width:20px;
  height:20px;
  fill:var(--dark-primary);
  flex-shrink:0;
}
.count-pill{
  height:100%;
  padding:0 16px 0 18px;
  border-radius:999px;
  background:linear-gradient(145deg, var(--primary), var(--dark-primary));
  color:var(--card);
  font-size:15px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(255,255,255,0.45);
  box-shadow:0 0 10px rgba(32,44,53,0.32), inset 1px 1px 2px rgba(255,255,255,0.35);
  white-space:nowrap;
}
.count-pill svg{
  width:19px;
  height:19px;
  fill:var(--card);
  flex-shrink:0;
}

/* Table Heading Box */
.th-bar{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:44px 1fr 82px 68px;
  align-items:center;
  background-color:var(--primary);
  background-image:
    linear-gradient(145deg, rgba(96,125,139,0.88), rgba(69,95,109,0.92)),
    var(--app-bg);
  background-size:100% 100%, 140% auto;
  background-position:center, center 18%;
  color:var(--card);
  border-radius:18px;
  padding:11px 14px;
  font-size:15px;
  font-weight:700;
  border:1.5px solid rgba(255,255,255,0.75);
  box-shadow:var(--dark-around), inset 0 1px 1px rgba(255,255,255,0.45);
  margin-bottom:10px;
}
.th-c{text-align:center}

/* Search & Add */
#s{
  display:block;
  width:100%;
  margin:10px 0;
  padding:11px 14px;
  font-size:16px;
  background:rgba(248,250,251,0.86);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.78);
  border-radius:16px;
  box-shadow:var(--dark-around-sm), var(--neu-inset);
  outline:none;
}
#s:focus{
  border-color:var(--primary);
  box-shadow:var(--dark-around), var(--neu-inset);
}
.add-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  margin:8px 0 12px;
  padding:11px 14px;
  border:1px solid rgba(255,255,255,0.85);
  border-radius:16px;
  background:linear-gradient(145deg, rgba(248,250,251,0.86), rgba(220,231,236,0.80));
  color:var(--dark-primary);
  font-size:16px;
  font-weight:700;
  box-shadow:var(--dark-around-sm);
  cursor:pointer;
}

/* Item Rows */
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:16px;
  background:linear-gradient(145deg, rgba(248,250,251,0.86), rgba(234,241,244,0.80));
  border:1px solid rgba(255,255,255,0.85);
  box-shadow:var(--dark-around-sm);
}
.row.on{
  background:linear-gradient(145deg, rgba(220,231,236,0.92), rgba(199,214,222,0.86));
  border-color:rgba(255,255,255,0.92);
  box-shadow:var(--dark-around-sm), var(--neu-inset);
}
.row label{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19.5px;
  font-weight:700;
  line-height:1.3;
  min-width:0;
}
.row input[type=checkbox]{
  width:22px;
  height:22px;
  accent-color:var(--dark-primary);
  flex-shrink:0;
}
.row .qty-input{
  display:none;
  width:76px;
  font-size:17.5px;
  font-weight:700;
  padding:6px 8px;
  text-align:center;
  border:1.5px solid var(--dark-primary);
  border-radius:12px;
  background:rgba(255,255,255,0.95);
  color:var(--text);
  box-shadow:var(--neu-inset);
  outline:none;
}
.row.on .qty-input{
  display:inline-block;
}
.unit{
  min-width:62px;
  text-align:center;
  color:var(--dark-primary);
  font-weight:700;
  font-size:15.5px;
  background:rgba(234,241,244,0.88);
  border:1px solid rgba(255,255,255,0.82);
  box-shadow:0 0 6px rgba(32,44,53,0.22);
  padding:4px 8px;
  border-radius:12px;
}

/* Primary & History Cards */
.btn{
  display:block;
  width:100%;
  margin:14px 0;
  padding:14px;
  border:1px solid rgba(255,255,255,0.55);
  border-radius:18px;
  background:linear-gradient(145deg, var(--primary), var(--dark-primary));
  color:var(--card);
  font-size:17px;
  font-weight:700;
  box-shadow:var(--dark-around);
  cursor:pointer;
}
.card{
  margin:9px 0;
  padding:12px 14px;
  background:linear-gradient(145deg, rgba(248,250,251,0.86), rgba(220,231,236,0.80));
  border:1px solid rgba(255,255,255,0.85);
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:var(--dark-around-sm);
}
.card .info{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.card .info b{font-size:17px}
.card .info small{color:var(--sec-text);font-size:14px}
.del{
  border:1px solid rgba(231,107,100,0.75);
  color:var(--delete);
  background:rgba(248,250,251,0.92);
  border-radius:12px;
  padding:7px 11px;
  font-size:14px;
  font-weight:700;
  box-shadow:0 0 8px rgba(32,44,53,0.22);
}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(145deg, rgba(248,250,251,0.86), rgba(220,231,236,0.80));
  border:1px solid rgba(255,255,255,0.85);
  border-radius:18px;
  padding:11px 14px;
  margin-bottom:10px;
  font-weight:700;
  color:var(--dark-primary);
  box-shadow:var(--dark-around-sm);
}
.back-btn{
  background:none;
  border:0;
  color:var(--dark-primary);
  font-size:16px;
  font-weight:700;
  padding:0;
}
.bar{
  position:sticky;
  bottom:0;
  background:rgba(234,241,244,0.76);
  padding:6px 0 2px;
  border-radius:18px;
}
img.preview-img{
  width:100%;
  border-radius:18px;
  display:block;
  box-shadow:var(--dark-around);
}
.empty-search{
  text-align:center;
  color:var(--sec-text);
  padding:22px 10px;
  font-weight:600;
  background:rgba(248,250,251,0.86);
  border-radius:16px;
  box-shadow:var(--dark-around-sm);
}
</style>
</head>

function getCustomItems(){
  try{
    const data=JSON.parse(localStorage.getItem("customItems")||"[]");
    return Array.isArray(data)?data.filter(x=>Array.isArray(x)&&x.length>=2):[];
  }catch(e){
    return [];
  }
}

function safeText(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function getAutoDate(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yyyy=d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

// Custom phonetic search normalization
// F=फ, Ph=फ, Sh=श/ष, A=अ/आ, Ay=ए, U=उ/ऊ
function normalizeCustomSearch(raw){
  let s=String(raw||"").toLowerCase().trim();

  s=s
    .replace(/ph/g,"f")
    .replace(/sh/g,"s")
    .replace(/ay/g,"e")
    .replace(/aa/g,"a")
    .replace(/ee/g,"i")
    .replace(/ii/g,"i")
    .replace(/oo/g,"u")
    .replace(/uu/g,"u");

  const hindiMap={
    "फ":"f",
    "श":"s","ष":"s","स":"s",
    "अ":"a","आ":"a","ा":"a",
    "ए":"e","े":"e","ै":"e",
    "उ":"u","ऊ":"u","ु":"u","ू":"u",
    "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
    "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny",
    "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
    "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
    "प":"p","ब":"b","भ":"bh","म":"m",
    "य":"y","र":"r","ल":"l","व":"v",
    "ह":"h","इ":"i","ई":"i","ि":"i","ी":"i",
    "ऋ":"ri","ृ":"ri","ओ":"o","ो":"o","औ":"au","ौ":"au",
    "ं":"n","ँ":"n","ः":"h","़":"","्":""
  };

  let out="";
  for(const ch of Array.from(s)){
    out+=Object.prototype.hasOwnProperty.call(hindiMap,ch)?hindiMap[ch]:ch;
  }

  return out.replace(/[^a-z0-9]/g,"");
}

function searchItems(value){
  const raw=value.trim();
  if(!raw)return ALL_ITEMS.map((_,i)=>i);

  const qNorm=normalizeCustomSearch(raw);
  const qLower=raw.toLowerCase();
  const results=[];

  ALL_ITEMS.forEach((item,i)=>{
    const itemNameLower=item[0].toLowerCase();
    const itemUnitLower=item[1].toLowerCase();
    const itemNorm=normalizeCustomSearch(item[0]);
    const unitNorm=normalizeCustomSearch(item[1]);

    const matched=
      itemNameLower.includes(qLower) ||
      itemUnitLower.includes(qLower) ||
      (qNorm && (itemNorm.includes(qNorm) || unitNorm.includes(qNorm)));

    if(matched)results.push(i);
  });

  return results;
}

function addItem(){
  const name=prompt("नए सामान का नाम लिखें:");
  if(!name||!name.trim())return;
  const cleanName=name.trim();
  const exists=ALL_ITEMS.some(x=>x[0].toLowerCase()===cleanName.toLowerCase());
  if(exists){alert("यह सामान पहले से सूची में है");return;}
  const unit=prompt("Unit लिखें (जैसे: KG, नग, पैकेट, पत्ता, पूड़ा, पेटी, टिन):","नग");
  if(!unit||!unit.trim())return;
  const item=[cleanName,unit.trim()];
  const custom=getCustomItems();
  custom.push(item);
  localStorage.setItem("customItems",JSON.stringify(custom));
  ALL_ITEMS.push(item);
  const currentSearch=$("#s")?$("#s").value:"";
  renderRows(searchItems(currentSearch));
}

function renderRows(indices){
  const container=$("#itemList");
  if(!indices.length){
    container.innerHTML=`<div class="empty-search">कोई सामान नहीं मिला</div>`;
    updateTickCount();
    return;
  }
  container.innerHTML=indices.map((i,idx)=>`
    <div class="row ${selectedItems[i]?"on":""}" id="r${i}">
      <label>
        <input type="checkbox" class="item-chk" data-i="${i}" ${selectedItems[i]?"checked":""}>
        <span>${String(idx+1).padStart(2,"0")}. ${safeText(ALL_ITEMS[i][0])}</span>
      </label>
      <input
        type="text"
        class="qty-input"
        inputmode="decimal"
        id="q${i}"
        placeholder="Qty"
        value="${selectedItems[i]?safeText(selectedItems[i].qty):""}"
      >
      <span class="unit">${safeText(ALL_ITEMS[i][1])}</span>
    </div>
  `).join("");

  indices.forEach(i=>{
    const rowEl=$("#r"+i);
    const checkbox=$(`#r${i} .item-chk`);
    const quantity=$("#q"+i);

    checkbox.onchange=()=>{
      if(checkbox.checked){
        selectedItems[i]={qty:quantity.value};
        rowEl.classList.add("on");
        setTimeout(()=>quantity.focus(),40);
      }else{
        delete selectedItems[i];
        rowEl.classList.remove("on");
        quantity.value="";
      }
      updateTickCount();
    };

    quantity.oninput=()=>{
      let clean=quantity.value.replace(/[^0-9.]/g,"");
      const parts=clean.split(".");
      if(parts.length>2){
        clean=parts[0]+"."+parts.slice(1).join("");
      }
      quantity.value=clean;
      if(!selectedItems[i]){
        selectedItems[i]={qty:clean};
        checkbox.checked=true;
        rowEl.classList.add("on");
        updateTickCount();
      }else{
        selectedItems[i].qty=clean;
      }
    };
  });

  updateTickCount();
}

function loadBgImage(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

function drawRoundedRectPath(g, x, y, w, h, r){
  const radius = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + radius, y);
  g.arcTo(x + w, y, x + w, y + h, radius);
  g.arcTo(x + w, y + h, x, y + h, radius);
  g.arcTo(x, y + h, x, y, radius);
  g.arcTo(x, y, x + w, y, radius);
  g.closePath();
}

function drawDarkAroundCard(g, x, y, w, h, r, fillStyle, strokeStyle = "rgba(255,255,255,0.88)", shadowAlpha = 0.28){
  g.save();
  g.shadowColor = `rgba(32, 44, 53, ${shadowAlpha})`;
  g.shadowBlur = 18;
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 0;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  g.save();
  g.shadowColor = `rgba(32, 44, 53, ${Math.min(0.38, shadowAlpha + 0.08)})`;
  g.shadowBlur = 14;
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 5;
  drawRoundedRectPath(g, x, y, w, h, r);
  g.fillStyle = fillStyle;
  g.fill();
  g.restore();

  drawRoundedRectPath(g, x, y, w, h, r);
  g.strokeStyle = strokeStyle;
  g.lineWidth = 2;
  g.stroke();
}

// Magnifies exact corresponding background area (anchored to top/box position so top elements stay aligned & zoomed)
function drawMagnifyBgBox(g, x, y, w, h, r, bgImg, canvasW, canvasH, zoomFactor, tintFill, alpha = 0.55){
  drawDarkAroundCard(g, x, y, w, h, r, tintFill, "rgba(255, 255, 255, 0.88)", 0.30);

  if(bgImg){
    g.save();
    drawRoundedRectPath(g, x + 2, y + 2, w - 4, h - 4, Math.max(2, r - 2));
    g.clip();

    const fullScale = Math.max(canvasW / bgImg.width, canvasH / bgImg.height);
    const fullW = bgImg.width * fullScale;
    const fullH = bgImg.height * fullScale;
    const fullX = (canvasW - fullW) / 2;
    const fullY = 0;

    // Anchor magnification around box center-top so top elements (like "1" at top) show slightly zoomed
    const anchorX = x + w / 2;
    const anchorY = y + h * 0.35;

    const zW = fullW * zoomFactor;
    const zH = fullH * zoomFactor;
    const zX = anchorX - ((anchorX - fullX) * zoomFactor);
    const zY = anchorY - ((anchorY - fullY) * zoomFactor);

    g.globalAlpha = alpha;
    g.drawImage(bgImg, zX, zY, zW, zH);
    g.restore();
  }
}

function drawCanvasLocationPin(g, cx, cy, size = 24, color = "#455F6D"){
  g.save();
  g.fillStyle = color;
  const r = size * 0.34;
  const topY = cy - size * 0.42;
  g.beginPath();
  g.arc(cx, topY + r, r, Math.PI * 0.85, Math.PI * 2.15);
  g.lineTo(cx, cy + size * 0.46);
  g.closePath();
  g.fill();

  g.beginPath();
  g.arc(cx, topY + r, r * 0.42, 0, Math.PI * 2);
  g.fillStyle = "#F8FAFB";
  g.fill();
  g.restore();
}

function drawCanvasShopLogo(g, cx, cy, radius = 50){
  g.save();
  g.shadowColor = "rgba(32, 44, 53, 0.28)";
  g.shadowBlur = 12;
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 0;

  const btnGrad = g.createRadialGradient(cx - radius * 0.2, cy - radius * 0.3, radius * 0.1, cx, cy, radius);
  btnGrad.addColorStop(0, "#FFFFFF");
  btnGrad.addColorStop(0.72, "#EAF3F8");
  btnGrad.addColorStop(1, "#CFE0EC");

  g.beginPath();
  g.arc(cx, cy, radius, 0, Math.PI * 2);
  g.fillStyle = btnGrad;
  g.fill();
  g.restore();

  g.beginPath();
  g.arc(cx, cy, radius, 0, Math.PI * 2);
  g.strokeStyle = "#B8CEE0";
  g.lineWidth = 2;
  g.stroke();

  const scale = radius / 60;
  g.save();
  g.translate(cx - 60 * scale, cy - 60 * scale);
  g.scale(scale, scale);

  const bodyGrad = g.createLinearGradient(0, 56, 0, 86);
  bodyGrad.addColorStop(0, "#3B627E");
  bodyGrad.addColorStop(1, "#27445B");
  g.fillStyle = bodyGrad;
  g.fillRect(32, 56, 56, 30);

  const darkAwning = g.createLinearGradient(0, 28, 0, 56);
  darkAwning.addColorStop(0, "#3F6784");
  darkAwning.addColorStop(1, "#294860");
  g.fillStyle = darkAwning;
  g.beginPath();
  g.moveTo(40, 31);
  g.quadraticCurveTo(42, 28, 46, 28);
  g.lineTo(74, 28);
  g.quadraticCurveTo(78, 28, 80, 31);
  g.lineTo(93, 56);
  g.lineTo(27, 56);
  g.closePath();
  g.fill();

  const lightAwning = g.createLinearGradient(0, 28, 0, 56);
  lightAwning.addColorStop(0, "#C3DCF0");
  lightAwning.addColorStop(1, "#9AC1DF");
  g.fillStyle = lightAwning;

  g.beginPath();
  g.moveTo(48, 28);
  g.lineTo(56, 28);
  g.lineTo(52, 56);
  g.lineTo(40, 56);
  g.closePath();
  g.fill();

  g.beginPath();
  g.moveTo(64, 28);
  g.lineTo(72, 28);
  g.lineTo(80, 56);
  g.lineTo(68, 56);
  g.closePath();
  g.fill();

  const flaps = [
    { x: 27, w: 12.6, light: true },
    { x: 39.6, w: 12.6, light: false },
    { x: 52.2, w: 12.6, light: true },
    { x: 64.8, w: 12.6, light: false },
    { x: 77.4, w: 15.6, light: true }
  ];
  flaps.forEach(f => {
    g.fillStyle = f.light ? lightAwning : darkAwning;
    g.beginPath();
    g.moveTo(f.x, 56);
    g.lineTo(f.x + f.w, 56);
    g.lineTo(f.x + f.w, 58.5);
    g.arc(f.x + f.w / 2, 58.5, f.w / 2, 0, Math.PI, false);
    g.closePath();
    g.fill();
  });

  g.fillStyle = "#F4F8FB";
  g.beginPath();
  g.moveTo(51, 86);
  g.lineTo(51, 70);
  g.quadraticCurveTo(51, 64, 57, 64);
  g.lineTo(63, 64);
  g.quadraticCurveTo(69, 64, 69, 70);
  g.lineTo(69, 86);
  g.closePath();
  g.fill();

  g.fillStyle = "#233E53";
  drawRoundedRectPath(g, 27, 85, 66, 7.5, 3.75);
  g.fill();

  g.restore();
}

async function draw4K(rows, dateStr){
  const W = 1080;
  const targetWidth = 3840;
  const S = targetWidth / W;

  const extraRows = typeof EXTRA_ROWS === "number" ? EXTRA_ROWS : 4;
  const startY = 374;
  const rowH = 102;
  const pillHeight = 82;
  const totalSlots = rows.length + extraRows;
  const H = startY + (totalSlots * rowH) + 36;

  const c = document.createElement("canvas");
  c.width = targetWidth;
  c.height = Math.ceil(H * S);

  const g = c.getContext("2d");
  g.scale(S, S);

  const L = 36;
  const R = W - 36;
  const boxW = R - L;
  const HF = '"Noto Sans Devanagari","Segoe UI",sans-serif';

  // 1. Full App Background (Anchored at Top)
  g.fillStyle = "#EAF1F4";
  g.fillRect(0, 0, W, H);

  const bgImg = await loadBgImage("app_bg.png");
  if(bgImg){
    const imgRatio = bgImg.width / bgImg.height;
    const canvasRatio = W / H;
    let dw = W, dh = H, dx = 0, dy = 0;
    if(imgRatio > canvasRatio){
      dh = H;
      dw = H * imgRatio;
      dx = (W - dw) / 2;
      dy = 0;
    }else{
      dw = W;
      dh = W / imgRatio;
      dx = 0;
      dy = 0;
    }
    g.drawImage(bgImg, dx, dy, dw, dh);
  }

  // 2. Top Heading Box - Magnifies Exact Top Background Area Slightly
  const topY = 24;
  const topH = 152;
  const topGrad = g.createLinearGradient(L, topY, R, topY + topH);
  topGrad.addColorStop(0, "rgba(248, 250, 251, 0.56)");
  topGrad.addColorStop(1, "rgba(220, 231, 236, 0.50)");
  drawMagnifyBgBox(g, L, topY, boxW, topH, 38, bgImg, W, H, 1.32, topGrad, 0.62);

  const badgeCx = L + 84;
  const badgeCy = topY + topH / 2;
  drawCanvasShopLogo(g, badgeCx, badgeCy, 50);

  g.fillStyle = "#202C35";
  g.textBaseline = "alphabetic";
  g.textAlign = "left";
  g.font = `bold 48px ${HF}`;
  g.fillText(SHOP, L + 150, topY + 68);

  drawCanvasLocationPin(g, L + 162, topY + 105, 26, "#455F6D");
  g.fillStyle = "#647783";
  g.font = `600 28px ${HF}`;
  g.fillText(PLACE, L + 182, topY + 114);

  const divX = R - 134;
  g.strokeStyle = "#C7D6DE";
  g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo(divX, topY + 24);
  g.lineTo(divX, topY + topH - 24);
  g.stroke();

  const cartCx = R - 68;
  const cartCy = topY + topH / 2 + 4;
  g.fillStyle = "#455F6D";
  g.fillRect(cartCx - 20, cartCy - 6, 34, 16);
  g.beginPath();
  g.arc(cartCx - 11, cartCy + 16, 5, 0, Math.PI * 2);
  g.arc(cartCx + 9, cartCy + 16, 5, 0, Math.PI * 2);
  g.fill();

  g.beginPath();
  g.arc(cartCx + 16, cartCy - 16, 18, 0, Math.PI * 2);
  g.fillStyle = "#607D8B";
  g.fill();
  g.fillStyle = "#FFFFFF";
  g.font = `bold 20px ${HF}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(String(rows.length), cartCx + 16, cartCy - 15);

  // 3. Date & Total List Heading Box
  const metaY = 192;
  const metaH = 66;
  const metaGrad = g.createLinearGradient(L, metaY, R, metaY + metaH);
  metaGrad.addColorStop(0, "rgba(248, 250, 251, 0.84)");
  metaGrad.addColorStop(1, "rgba(220, 231, 236, 0.78)");
  drawMagnifyBgBox(g, L, metaY, boxW, metaH, metaH / 2, bgImg, W, H, 1.28, metaGrad, 0.35);

  g.fillStyle = "#455F6D";
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.font = `bold 30px ${HF}`;
  g.fillText(`दिनांक: ${dateStr}`, L + 32, metaY + metaH / 2 + 1);

  const pillW = 286;

  pillGrad.addColorStop(0, "#607D8B");
  pillGrad.addColorStop(1, "#455F6D");
  g.fillStyle = pillGrad;
  g.fill();

  g.fillStyle = "#FFFFFF";
  g.font = `bold 30px ${HF}`;
  g.textAlign = "center";
  g.fillText(`कुल सूची: ${rows.length}`, pillX + pillW / 2 - 12, metaY + metaH / 2 + 1);

  // 4. Table Heading Box
  const thY = 276;
  const thH = 78;
  const thGrad = g.createLinearGradient(L, thY, R, thY + thH);
  thGrad.addColorStop(0, "rgba(96, 125, 139, 0.88)");
  thGrad.addColorStop(1, "rgba(69, 95, 109, 0.92)");

  g.textAlign = "left";
  g.fillText("No.", L + 32, thY + thH / 2 + 1);

    g.fillText(String(i + 1).padStart(2, "0"), L + 32, cy + 1);

    g.fillStyle = "#202C35";
    g.font = `bold 40px ${HF}`;
    g.fillText(r.name, L + 148, cy + 1, 415);

    g.fillStyle = "#202C35";
    g.font = `bold 38px ${HF}`;
    g.textAlign = "center";
    g.fillText(String(r.qty), 675, cy + 1);

    const uW = 142;
    const uH = 50;
    const uX = R - 176;
    drawRoundedRectPath(g, uX, cy - (uH / 2), uW, uH, uH / 2);
    g.fillStyle = "#DCE7EC";
    g.fill();
    g.strokeStyle = "#C7D6DE";
    g.lineWidth = 1.5;
    g.stroke();

    g.fillStyle = "#455F6D";
    g.font = `bold 27px ${HF}`;
    g.fillText(String(r.unit), uX + (uW / 2), cy + 1);
  }

  return c.toDataURL("image/jpeg", 0.98).split(",")[1];
}

async function exportList(){
  const rows=[];
  Object.keys(selectedItems).forEach(key=>{
    const i=Number(key);
    rows.push({
      name:ALL_ITEMS[i][0],
      unit:ALL_ITEMS[i][1],
      qty:selectedItems[i].qty||"-"
    });
  });

  if(!rows.length){
    alert("कम से कम एक सामान tick करें");
    return;
  }

  const d=new Date();
  const dateStr=getAutoDate();
  const b64=await draw4K(rows,dateStr);
  const id=Date.now();

  try{
    if(P() && P().Share && FS()){
      const f=await FS().writeFile({
        path:`share_${id}.jpg`,
        data:b64,
        directory:"CACHE"
      });
      await P().Share.share({
        title:"Saman List",
        files:[f.uri]
      });
      await FS().writeFile({
        path:`lists/${id}.jpg`,
        data:b64,
        directory:"DATA",
        recursive:true
      });
    }else{
      const link=document.createElement("a");
      link.href="data:image/jpeg;base64,"+b64;
      link.download=`saman_list_${id}.jpg`;
      link.click();
    }

    const h=hist();
    h.unshift({
      id,
      date:dateStr+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      count:rows.length
    });
    localStorage.setItem("hist",JSON.stringify(h));
    home();
  }catch(e){
    if(!/cancel/i.test(String(e&&e.message||e))){
      alert("Error: "+e);
    }
  }
}

home();
</script>
